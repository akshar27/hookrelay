services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
    ports:
      # host 5435 — avoids native Postgres (5432) and the other portfolio projects (5433/5434)
      - "5435:5432"
    volumes:
      - hookrelay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOOKRELAY_ENV: production
      HOOKRELAY_DATABASE_URL: postgres://hookrelay:hookrelay@db:5432/hookrelay?sslmode=disable
      HOOKRELAY_ADMIN_TOKEN: dev-admin-token-change-me
      HOOKRELAY_SECRET_KEY: "3J8xURQ0m6h3n8k1e7p2s5v9y2A5D8F1H4K7N0Q3T6W="
    ports:
      - "8080:8080"

volumes:
  hookrelay_pg:
